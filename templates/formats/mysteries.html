<!doctype html>
<!--
  FORMAT: ROBLOX MYSTERIES — Phase 2. Purple accent #8B5CF6.
  Hook -> setup -> evidence -> truth -> conclusion. Dark, eerie mood,
  question mark hook, labelled evidence/truth cards, image card with
  Ken Burns motion in every scene. 5 scenes, 10 s base (builder scales
  + re-times to the narration).
  Phase 4B (Brand and Retention): persistent "NoobNoMore" watermark
  (top-right), original voxel mascot pop-in in the last scene, CTA
  "FOLLOW NOOBNOMORE", and 3-segment cut-zoom Ken Burns on every image.
  Images: data-img-scene="N" — build_video.py --image-map rewrites src.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("../../assets/fonts/Montserrat-Variable.woff2") format("woff2"); }
      :root { --ground: #0b1026; --ground-2: #1a1033; --ink: #ffffff; --muted: #b9a8e8; --accent: #8b5cf6; --accent2: #22d3ee; --amber: #f59e0b; --font-display: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); background: linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 62%, #0a0e22 100%); overflow: hidden; }
      .clip { position: absolute; }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
      #glow-a { width: 620px; height: 620px; left: -160px; top: 180px; background: #7c3aed; }
      #glow-b { width: 560px; height: 560px; right: -180px; top: 980px; background: #0ea5e9; opacity: 0.35; }
      .grid { position: absolute; inset: 0; opacity: 0.14; background-image: linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px); background-size: 108px 108px; }
      .pill { display: inline-block; padding: 16px 30px; border-radius: 999px; font-weight: 800; font-size: 34px; letter-spacing: 0.12em; color: #ede9fe; background: var(--accent); }
      .pill-outline { color: var(--ink); background: rgba(255,255,255,0.08); border: 3px solid rgba(255,255,255,0.35); }
      h1.title { color: var(--ink); font-weight: 900; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; text-transform: uppercase; text-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 18px 44px rgba(0,0,0,0.55); }
      h1.title .accent { color: var(--accent2); }
      .big-q { color: var(--accent); font-weight: 900; font-size: 280px; line-height: 0.9; text-shadow: 0 0 80px rgba(139,92,246,0.65); }
      .section-label { display: inline-block; padding: 14px 28px; border-radius: 999px; font-weight: 800; font-size: 34px; letter-spacing: 0.14em; color: var(--accent2); background: rgba(34,211,238,0.12); border: 3px solid rgba(34,211,238,0.5); }
      .myst-head { color: var(--ink); font-weight: 900; font-size: 68px; line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase; margin-top: 24px; text-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 16px 40px rgba(0,0,0,0.5); }
      .subtitle { color: var(--muted); font-weight: 700; font-size: 50px; line-height: 1.25; }
      .progress-track { width: 840px; height: 10px; border-radius: 99px; background: rgba(255,255,255,0.18); overflow: hidden; }
      #progress-fill { width: 100%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform-origin: left center; }
      .caption { width: 840px; text-align: center; color: var(--ink); font-weight: 800; font-size: 54px; line-height: 1.3; text-shadow: 0 4px 0 rgba(0,0,0,0.6), 0 10px 28px rgba(0,0,0,0.6); }
      .caption .hl { color: #fde047; }
      .cta { display: inline-block; padding: 26px 44px; border-radius: 999px; background: var(--amber); color: #231303; font-weight: 900; font-size: 44px; letter-spacing: 0.04em; box-shadow: 0 14px 40px rgba(245,158,11,0.45); }
      .watermark { font-weight: 800; font-size: 30px; letter-spacing: 0.1em; color: #1FD1C1; opacity: 0.85; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
      .mascot { position: absolute; width: 240px; height: 240px; }
      .scene { width: 1080px; height: 1920px; left: 0; top: 0; }
      .scene-inner { position: absolute; left: 120px; top: 340px; width: 840px; }
      .img-wrap { width: 840px; height: 680px; border-radius: 28px; overflow: hidden; border: 3px solid rgba(255,255,255,0.18); box-shadow: 0 24px 60px rgba(0,0,0,0.5); margin-top: 36px; }
      .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cta-zone { position: absolute; left: 120px; top: 1760px; width: 840px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="mysteries" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div class="grid clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="glow-a" class="glow clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="glow-b" class="glow clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="1" style="left:120px; top:180px;">
        <span class="pill">ROBLOX MYSTERIES</span>
      </div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="1" style="left:120px; top:270px;">
        <div class="progress-track"><div id="progress-fill"></div></div>
      </div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="1" style="left:630px; top:150px; width:300px; text-align:right;">
        <span class="watermark">NoobNoMore</span>
      </div>
      <div class="scene clip" data-start="0" data-duration="2" data-track-index="2">
        <div class="scene-inner" id="inner-0">
          <div id="q-0" class="big-q">?</div>
          <h1 id="title-0" class="title" style="font-size:96px;">THE ROBLOX<br /><span class="accent">HACKER MYTH.</span></h1>
          <div class="img-wrap"><img id="img-0" data-img-scene="0" src="assets/images/placeholder.webp" alt="" /></div>
        </div>
      </div>
      <div class="scene clip" data-start="2" data-duration="2" data-track-index="2">
        <div class="scene-inner" id="inner-1">
          <span id="label-1" class="section-label">THE SETUP</span>
          <p id="head-1" class="myst-head">A name in a haunted hat</p>
          <div class="img-wrap"><img id="img-1" data-img-scene="1" src="assets/images/placeholder.webp" alt="" /></div>
        </div>
      </div>
      <div class="scene clip" data-start="4" data-duration="2" data-track-index="2">
        <div class="scene-inner" id="inner-2">
          <span id="label-2" class="section-label">THE EVIDENCE</span>
          <p id="head-2" class="myst-head">Every crash looked like proof</p>
          <div class="img-wrap"><img id="img-2" data-img-scene="2" src="assets/images/placeholder.webp" alt="" /></div>
        </div>
      </div>
      <div class="scene clip" data-start="6" data-duration="2" data-track-index="2">
        <div class="scene-inner" id="inner-3">
          <span id="label-3" class="section-label">THE TRUTH</span>
          <p id="head-3" class="myst-head">A test account, not a hacker</p>
          <div class="img-wrap"><img id="img-3" data-img-scene="3" src="assets/images/placeholder.webp" alt="" /></div>
        </div>
      </div>
      <div class="scene clip" data-start="8" data-duration="2" data-track-index="2">
        <div class="scene-inner" id="inner-4">
          <h1 id="title-4" class="title">THE LEGEND<br /><span class="accent">LIVES ON.</span></h1>
          <p id="sub-4" class="subtitle" style="margin-top:36px;">Now he haunts Forsaken.</p>
          <div class="img-wrap"><img id="img-4" data-img-scene="4" src="assets/images/placeholder.webp" alt="" /></div>
        </div>
        <div class="cta-zone"><span id="cta" class="cta">FOLLOW NOOBNOMORE</span></div>
        <img id="mascot" class="mascot" src="../../assets/brand/noobnomore-mascot-transparent.png" alt="" style="left:690px; top:1134px;" />
      </div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="3" style="left:120px; top:1520px;">
        <p class="caption">Your caption goes here.</p>
      </div>
      <audio id="narration" src="../../voiceover/narration.mp3" data-start="0" data-duration="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 10, ease: "none" }, 0);
      tl.fromTo("#glow-a", { x: 0, y: 0 }, { x: 90, y: 60, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#glow-b", { x: 0, y: 0 }, { x: -70, y: -50, duration: 10, ease: "sine.inOut" }, 0);
      // Scene 0 — hook
      tl.fromTo("#inner-0", { x: 1080, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#q-0", { opacity: 0, scale: 0.5, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.1);
      tl.fromTo("#title-0", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.35);
      tl.fromTo("#img-0", { scale: 1, x: -14 }, { scale: 1.07, x: -4.67, duration: 0.67, ease: "none" }, 0);
      tl.fromTo("#img-0", { scale: 1.1, x: -4.67 }, { scale: 1.16, x: 4.67, duration: 0.67, ease: "none" }, 0.67);
      tl.fromTo("#img-0", { scale: 1.19, x: 4.67 }, { scale: 1.24, x: 14, duration: 0.67, ease: "none" }, 1.33);
      tl.to("#inner-0", { x: -1080, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.65);
      // Scene 1 — setup
      tl.fromTo("#inner-1", { x: 1080, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2);
      tl.fromTo("#label-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.1);
      tl.fromTo("#head-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.35);
      tl.fromTo("#img-1", { scale: 1.18, x: 14 }, { scale: 1.13, x: 4.67, duration: 0.67, ease: "none" }, 2);
      tl.fromTo("#img-1", { scale: 1.1, x: 4.67 }, { scale: 1.05, x: -4.67, duration: 0.67, ease: "none" }, 2.67);
      tl.fromTo("#img-1", { scale: 1.02, x: -4.67 }, { scale: 1, x: -14, duration: 0.67, ease: "none" }, 3.33);
      tl.to("#inner-1", { x: -1080, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.65);
      // Scene 2 — evidence
      tl.fromTo("#inner-2", { x: 1080, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 4);
      tl.fromTo("#label-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.1);
      tl.fromTo("#head-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.35);
      tl.fromTo("#img-2", { scale: 1, x: 18 }, { scale: 1.07, x: 6, duration: 0.67, ease: "none" }, 4);
      tl.fromTo("#img-2", { scale: 1.1, x: 6 }, { scale: 1.16, x: -6, duration: 0.67, ease: "none" }, 4.67);
      tl.fromTo("#img-2", { scale: 1.19, x: -6 }, { scale: 1.24, x: -18, duration: 0.67, ease: "none" }, 5.33);
      tl.to("#inner-2", { x: -1080, opacity: 0, duration: 0.35, ease: "power2.in" }, 5.65);
      // Scene 3 — truth
      tl.fromTo("#inner-3", { x: 1080, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6);
      tl.fromTo("#label-3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.1);
      tl.fromTo("#head-3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.35);
      tl.fromTo("#img-3", { scale: 1.18, x: 14 }, { scale: 1.13, x: 4.67, duration: 0.67, ease: "none" }, 6);
      tl.fromTo("#img-3", { scale: 1.1, x: 4.67 }, { scale: 1.05, x: -4.67, duration: 0.67, ease: "none" }, 6.67);
      tl.fromTo("#img-3", { scale: 1.02, x: -4.67 }, { scale: 1, x: -14, duration: 0.67, ease: "none" }, 7.33);
      tl.to("#inner-3", { x: -1080, opacity: 0, duration: 0.35, ease: "power2.in" }, 7.65);
      // Scene 4 — conclusion (stays on screen to the end: no slide-out)
      tl.fromTo("#inner-4", { x: 1080, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 8);
      tl.fromTo("#title-4", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 8.15);
      tl.fromTo("#sub-4", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.5);
      tl.fromTo("#img-4", { scale: 1, x: -18 }, { scale: 1.07, x: -6, duration: 0.67, ease: "none" }, 8);
      tl.fromTo("#img-4", { scale: 1.1, x: -6 }, { scale: 1.16, x: 6, duration: 0.67, ease: "none" }, 8.67);
      tl.fromTo("#img-4", { scale: 1.19, x: 6 }, { scale: 1.24, x: 18, duration: 0.67, ease: "none" }, 9.33);
      tl.fromTo("#cta", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 8.7);
      tl.fromTo("#mascot", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 8.7);
      tl.to("#cta", { scale: 1.06, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.2);
      window.__timelines["mysteries"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
